<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account · PawCare</title><link rel="stylesheet" href="styles.css"></head><body><div class="auth"><section class="authvisual"><div class="brand"><div class="logo">🐾</div><span>PawCare</span></div><h1>Your pets deserve a smarter care routine.</h1><p>Create one account and keep every pet profile, reminder, visit and health record organized.</p><div style="font-size:100px">🐾</div></section><section class="authbox"><div class="eyebrow">Get started</div><h2>Create your PawCare account</h2><p class="muted">Your profile is created automatically after signup.</p><div class="field" style="margin-top:25px"><label>Full name</label><input id="full_name" placeholder="Pet Owner"></div><div class="field"><label>Email</label><input id="email" type="email" placeholder="you@example.com"></div><div class="field"><label>Password</label><input id="password" type="password" minlength="6" placeholder="At least 6 characters"></div><button class="btn" style="width:100%;justify-content:center" onclick="signup()">Create account</button><p class="muted" style="text-align:center;margin-top:20px">Already have an account? <a href="login.html" style="color:var(--green);font-weight:700">Sign in</a></p></section></div><div id="toast" class="toast"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="app.js"></script></body></html>
